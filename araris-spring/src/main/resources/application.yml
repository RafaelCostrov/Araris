spring:
  application:
    name: araris-spring
  config:
    import:
      - optional:file:../araris-back/.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:araris}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  security:
    jwt:
      issuer: araris-spring
      secret: ${ARARIS_JWT_SECRET:YXJhcmlzLXNwcmluZy1kZXYtc2VjcmV0LWNoYW5nZS1tZSE=}
      access-token-minutes: 15
      refresh-token-days: 7
