spring:
  datasource:
    url: jdbc:h2:mem:araris;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      issuer: araris-spring-test
      secret: YXJhcmlzLXNwcmluZy10ZXN0LXNlY3JldC1mb3Itand0LXNpZ25pbmc=
      access-token-minutes: 15
      refresh-token-days: 7
